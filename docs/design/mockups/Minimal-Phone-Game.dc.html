<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Minimalist Premium, phone game</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;scrollbar-width:none}
::-webkit-scrollbar{width:0;height:0;display:none}
a{color:#2B241D}a:hover{color:#0B7A87}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid #0B7A87;outline-offset:3px}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #E4D2B2; color: #2B241D; font-family: Jost, system-ui, sans-serif; display: flex; flex-direction: column; padding: 14px 16px 28px">
<svg aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none"><filter id="wood" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.005 0.09" numOctaves="3" seed="11"></feTurbulence><feColorMatrix type="matrix" values="0 0 0 0 0.47  0 0 0 0 0.34  0 0 0 0 0.2  1.4 0 0 0 -0.55"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#wood)" opacity="0.4"></rect></svg>
<header style="position: relative; display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 48px; margin-bottom: 18px">
<a href="#home" style="display: flex; align-items: center; gap: 10px; min-height: 44px; text-decoration: none; color: #2B241D">
<svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="7" fill="#FCFCFA"></rect><rect x="9" y="9" width="14" height="14" fill="#2F86C6"></rect><path d="M9 9H23M9 23H23M9 9V23" stroke="#3A3A3D" stroke-width="2.8" stroke-linecap="round"></path><path d="M23 9V23" stroke="#B92E3B" stroke-width="2.8" stroke-linecap="round"></path><g fill="#646468"><circle cx="9" cy="9" r="2.6"></circle><circle cx="23" cy="9" r="2.6"></circle><circle cx="9" cy="23" r="2.6"></circle><circle cx="23" cy="23" r="2.6"></circle></g></svg>
<b style="font-weight: 700; font-size: 19px; letter-spacing: 0.01em">Grid Rivals</b>
</a>
<button aria-label="Ama, level 7. Open your stats" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 4px 14px 4px 4px; border: 0; border-radius: 999px; background: #FFFFFF; color: #2B241D; box-shadow: 0 6px 14px -8px rgba(60, 38, 14, 0.5)">
<span aria-hidden="true" style="position: relative; flex: none; width: 36px; height: 36px"><svg width="36" height="36" viewBox="0 0 36 36" style="position: absolute; left: 0; top: 0"><circle cx="18" cy="18" r="16.5" fill="none" stroke="#EDE7DC" stroke-width="3"></circle><circle cx="18" cy="18" r="16.5" fill="none" stroke="#0B7A87" stroke-width="3" stroke-dasharray="103.7 103.7" stroke-dashoffset="93.3" transform="rotate(-90 18 18)" stroke-linecap="round"></circle></svg><span style="position: absolute; left: 5px; top: 5px"><svg width="26" height="26" viewBox="0 0 64 64" aria-hidden="true" style="display: block"><circle cx="32" cy="32" r="32" fill="#F4C95D"></circle><path d="M10.83 56 C 14 50, 22 47, 32 47 S 50 50, 53.17 56 A 32 32 0 0 1 10.83 56 Z" fill="#3B7A57"></path><path d="M27 40 H37 V47.5 C 37 50.5, 27 50.5, 27 47.5 Z" fill="#7A4A2F"></path><circle cx="19.4" cy="31" r="3.3" fill="#8D5A3B"></circle><circle cx="44.6" cy="31" r="3.3" fill="#8D5A3B"></circle><ellipse cx="32" cy="30" rx="13" ry="14" fill="#8D5A3B"></ellipse><path d="M18.6 32 C 17 20.5, 24 14.5, 32 14.5 S 47 20.5, 45.4 32 C 44 25.5, 40.5 22.4, 32 22.2 S 20 25.5, 18.6 32 Z" fill="#1E1712"></path><circle cx="32" cy="10.5" r="7" fill="#1E1712"></circle><circle cx="27.3" cy="31.2" r="1.9" fill="#1E1712"></circle><circle cx="36.7" cy="31.2" r="1.9" fill="#1E1712"></circle><path d="M27.8 36.6 Q 32 40.2, 36.2 36.6" fill="none" stroke="#1E1712" stroke-width="1.9" stroke-linecap="round"></path><circle cx="23.8" cy="35.2" r="2.4" fill="#E07A5F" opacity="0.45"></circle><circle cx="40.2" cy="35.2" r="2.4" fill="#E07A5F" opacity="0.45"></circle></svg></span></span>
<span style="display: flex; flex-direction: column; align-items: flex-start; line-height: 1.15"><b style="font-weight: 700; font-size: 15px">Ama</b><small style="font-weight: 600; font-size: 12px; color: #5A4C3D">Lv 7</small></span>
</button>
</header>
<div style="position: relative; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="display: flex; align-items: center; gap: 10px; min-width: 0; padding: 10px 12px; border-radius: 14px; background: #FFFFFF; box-shadow: {{shA}}">
<span aria-hidden="true" style="flex: none; display: block; width: 40px; height: 40px; border-radius: 50%; box-shadow: 0 0 0 2px #FFFFFF, 0 0 0 4px #2F86C6"><svg width="40" height="40" viewBox="0 0 64 64" aria-hidden="true" style="display: block"><circle cx="32" cy="32" r="32" fill="#F4C95D"></circle><path d="M10.83 56 C 14 50, 22 47, 32 47 S 50 50, 53.17 56 A 32 32 0 0 1 10.83 56 Z" fill="#3B7A57"></path><path d="M27 40 H37 V47.5 C 37 50.5, 27 50.5, 27 47.5 Z" fill="#7A4A2F"></path><circle cx="19.4" cy="31" r="3.3" fill="#8D5A3B"></circle><circle cx="44.6" cy="31" r="3.3" fill="#8D5A3B"></circle><ellipse cx="32" cy="30" rx="13" ry="14" fill="#8D5A3B"></ellipse><path d="M18.6 32 C 17 20.5, 24 14.5, 32 14.5 S 47 20.5, 45.4 32 C 44 25.5, 40.5 22.4, 32 22.2 S 20 25.5, 18.6 32 Z" fill="#1E1712"></path><circle cx="32" cy="10.5" r="7" fill="#1E1712"></circle><circle cx="27.3" cy="31.2" r="1.9" fill="#1E1712"></circle><circle cx="36.7" cy="31.2" r="1.9" fill="#1E1712"></circle><path d="M27.8 36.6 Q 32 40.2, 36.2 36.6" fill="none" stroke="#1E1712" stroke-width="1.9" stroke-linecap="round"></path><circle cx="23.8" cy="35.2" r="2.4" fill="#E07A5F" opacity="0.45"></circle><circle cx="40.2" cy="35.2" r="2.4" fill="#E07A5F" opacity="0.45"></circle></svg></span>
<div style="flex: 1; min-width: 0"><div style="font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Ama</div><div style="font-size: 13px; color: #5A4C3D">Level 7</div></div>
<div aria-label="Ama score 5" style="font-weight: 800; font-size: 30px; line-height: 1; color: #1F5F8C; font-variant-numeric: tabular-nums">5</div>
</div>
<div style="display: flex; align-items: center; gap: 10px; min-width: 0; padding: 10px 12px; border-radius: 14px; background: #FFFFFF; box-shadow: {{shT}}">
<span aria-hidden="true" style="flex: none; display: block; width: 40px; height: 40px; border-radius: 50%; box-shadow: 0 0 0 2px #FFFFFF, 0 0 0 4px #B92E3B"><svg width="40" height="40" viewBox="0 0 64 64" aria-hidden="true" style="display: block"><circle cx="32" cy="32" r="32" fill="#B92E3B"></circle><path d="M12.41 57.3 C 16 52, 23 50, 32 50 S 48 52, 51.59 57.3 A 32 32 0 0 1 12.41 57.3 Z" fill="#FFFFFF"></path><rect x="28" y="44" width="8" height="7" fill="#2B241D"></rect><path d="M32 18 V12" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"></path><circle cx="32" cy="9.5" r="3.8" fill="#7FD3DD" stroke="#FFFFFF" stroke-width="2"></circle><rect x="11.5" y="25.5" width="6" height="13" rx="3" fill="#FFFFFF"></rect><rect x="46.5" y="25.5" width="6" height="13" rx="3" fill="#FFFFFF"></rect><rect x="16" y="17" width="32" height="28" rx="9" fill="#FFFFFF"></rect><rect x="20" y="24" width="24" height="12" rx="6" fill="#2B241D"></rect><circle cx="26.5" cy="30" r="2.7" fill="#7FD3DD"></circle><circle cx="37.5" cy="30" r="2.7" fill="#7FD3DD"></circle><rect x="26.5" y="39" width="11" height="2.8" rx="1.4" fill="#2B241D"></rect></svg></span>
<div style="flex: 1; min-width: 0"><div style="font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Tactician</div><div style="font-size: 13px; color: #5A4C3D">Medium AI</div></div>
<div aria-label="Tactician score 4" style="font-weight: 800; font-size: 30px; line-height: 1; color: #8C1F2A; font-variant-numeric: tabular-nums">4</div>
</div>
<div role="status" style="grid-column: 1 / -1; position: relative; height: 42px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 6px 14px -8px rgba(60, 38, 14, 0.5); overflow: hidden">
<div style="position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); box-sizing: border-box; border-radius: 999px; background: {{pill.bg}}; border: 1.5px solid {{pill.bd}}; transform: {{pill.tf}}; display: grid; place-items: center; font-weight: 700; font-size: 14px; white-space: nowrap">{{pill.text}}</div>
</div>
</div>
<div style="position: relative; display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0">
<span style="display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 4px 14px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 6px 14px -8px rgba(60, 38, 14, 0.5); font-weight: 600; font-size: 14px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2 2M9 2h6"></path></svg><b style="font-weight: 700; font-variant-numeric: tabular-nums">1:42</b></span>
<span style="display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 4px 14px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 6px 14px -8px rgba(60, 38, 14, 0.5); font-weight: 600; font-size: 14px">5×5</span>
<span style="display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 4px 14px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 6px 14px -8px rgba(60, 38, 14, 0.5); font-weight: 600; font-size: 14px">Medium</span>
<span style="display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 4px 14px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 6px 14px -8px rgba(60, 38, 14, 0.5); font-weight: 600; font-size: 14px">Lv 7<span style="width: 46px; height: 6px; border-radius: 999px; background: #EDE7DC; overflow: hidden"><i style="display: block; width: 10%; height: 100%; background: #0B7A87"></i></span></span>
</div>
<div style="position: relative; width: 358px; max-width: 100%; margin: 0 auto; box-sizing: border-box; padding: 5px; background: #FCFCFA; box-shadow: 0 2px 0 rgba(90, 64, 36, 0.08), 0 22px 36px -18px rgba(70, 46, 20, 0.55)">
<svg viewBox="0 0 600 600" role="img" aria-label="{{boardLabel}}" style="display: block; width: 100%; height: auto">
<sc-for list="{{lanes}}" as="l" hint-placeholder-count="60">
<line x1="{{l.x1}}" y1="{{l.y1}}" x2="{{l.x2}}" y2="{{l.y2}}" stroke="#E6E6EA" stroke-width="12"></line>
</sc-for>
<sc-for list="{{boxes}}" as="b" hint-placeholder-count="9">
<rect x="{{b.x}}" y="{{b.y}}" width="86" height="86" fill="{{b.fill}}" stroke="{{b.rim}}" stroke-width="8" stroke-opacity="0.5"></rect>
<path d="{{b.icon}}" fill="#FFFFFF" fill-rule="evenodd" opacity="0.94"></path>
</sc-for>
<sc-for list="{{lines}}" as="l" hint-placeholder-count="42">
<line x1="{{l.sx1}}" y1="{{l.sy1}}" x2="{{l.sx2}}" y2="{{l.sy2}}" stroke="#000000" stroke-width="14" opacity="0.16"></line>
<line x1="{{l.x1}}" y1="{{l.y1}}" x2="{{l.x2}}" y2="{{l.y2}}" stroke="{{l.c}}" stroke-width="14"></line>
</sc-for>
<sc-for list="{{dots}}" as="d" hint-placeholder-count="36">
<circle cx="{{d.sx}}" cy="{{d.sy}}" r="13" fill="#000000" opacity="0.18"></circle>
<circle cx="{{d.x}}" cy="{{d.y}}" r="13" fill="#646468"></circle>
</sc-for>
<circle cx="{{pip.x}}" cy="{{pip.y}}" r="8.5" fill="#2F86C6" stroke="#FFFFFF" stroke-width="3"></circle>
</svg>
</div>
<div style="position: relative; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 16px">
<button style="min-height: 46px; padding: 8px 14px; border: 0; border-radius: 14px; background: #FFFFFF; color: #2B241D; font-weight: 600; font-size: 16px; box-shadow: 0 4px 0 #CDB894, 0 10px 18px -12px rgba(60, 38, 14, 0.5)">Quit</button>
<button style="min-height: 46px; padding: 8px 14px; border: 0; border-radius: 14px; background: #FFFFFF; color: #2B241D; font-weight: 600; font-size: 16px; box-shadow: 0 4px 0 #CDB894, 0 10px 18px -12px rgba(60, 38, 14, 0.5)">Restart</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"moment":{"editor":"enum","options":["Extra turn","Tactician thinking"],"default":"Extra turn"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const thinking = (this.props.moment ?? 'Extra turn') === 'Tactician thinking';
    const H = ['tatat', 't..aa', 't....', 'ata.a', 't..aa', 'tatat'];
    const V = ['at.taa', thinking ? 'ttaa.t' : 'tta..t', 'at.t.a', '..t.aa', 'tt.aat'];
    const last = thinking ? 'v1,3' : 'h3,4';
    const B = ['t..aa', 't....', 't....', '....a', 't..aa'];
    const P = (i) => 50 + i * 100;
    const fill = { a: '#2F86C6', t: '#B92E3B' };
    const rim = { a: '#1F5F8C', t: '#8C1F2A' };
    const circ = (x, y, r) => 'M' + (x - r) + ' ' + y + ' a' + r + ' ' + r + ' 0 1 0 ' + (2 * r) + ' 0 a' + r + ' ' + r + ' 0 1 0 ' + (-2 * r) + ' 0 Z ';
    const rr = (x, y, w, h, r) => 'M' + (x + r) + ' ' + y + ' H' + (x + w - r) + ' Q' + (x + w) + ' ' + y + ' ' + (x + w) + ' ' + (y + r) + ' V' + (y + h - r) + ' Q' + (x + w) + ' ' + (y + h) + ' ' + (x + w - r) + ' ' + (y + h) + ' H' + (x + r) + ' Q' + x + ' ' + (y + h) + ' ' + x + ' ' + (y + h - r) + ' V' + (y + r) + ' Q' + x + ' ' + y + ' ' + (x + r) + ' ' + y + ' Z ';
    const person = (x, y) => circ(x, y - 11, 9) + 'M' + (x - 17) + ' ' + (y + 19) + ' C' + (x - 17) + ' ' + (y + 2) + ' ' + (x + 17) + ' ' + (y + 2) + ' ' + (x + 17) + ' ' + (y + 19) + ' Z';
    const bot = (x, y) => rr(x - 17, y - 8, 34, 26, 7) + circ(x - 7, y + 4, 3.6) + circ(x + 7, y + 4, 3.6) + circ(x, y - 16, 3.4) + 'M' + (x - 1.6) + ' ' + (y - 12.6) + ' H' + (x + 1.6) + ' V' + (y - 8) + ' H' + (x - 1.6) + ' Z';
    const lanes = [], lines = [], boxes = [], dots = [];
    const add = (x1, y1, x2, y2, id) => lines.push({ x1: x1, y1: y1, x2: x2, y2: y2, sx1: x1 + 3, sy1: y1 + 4, sx2: x2 + 3, sy2: y2 + 4, c: id === last ? '#161618' : '#3A3A3D' });
    for (let r = 0; r < 6; r++) for (let c = 0; c < 5; c++) lanes.push({ x1: P(c), y1: P(r), x2: P(c + 1), y2: P(r) });
    for (let r = 0; r < 5; r++) for (let c = 0; c < 6; c++) lanes.push({ x1: P(c), y1: P(r), x2: P(c), y2: P(r + 1) });
    H.forEach((row, r) => row.split('').forEach((ch, c) => { if (ch !== '.') add(P(c), P(r), P(c + 1), P(r), 'h' + r + ',' + c); }));
    V.forEach((row, r) => row.split('').forEach((ch, c) => { if (ch !== '.') add(P(c), P(r), P(c), P(r + 1), 'v' + r + ',' + c); }));
    B.forEach((row, r) => row.split('').forEach((ch, c) => {
      if (ch === '.') return;
      const cx = P(c) + 50, cy = P(r) + 50;
      boxes.push({ x: P(c) + 7, y: P(r) + 7, fill: fill[ch], rim: rim[ch], icon: ch === 'a' ? person(cx, cy) : bot(cx, cy) });
    }));
    for (let r = 0; r < 6; r++) for (let c = 0; c < 6; c++) dots.push({ x: P(c), y: P(r), sx: P(c) + 3, sy: P(r) + 4 });
    return {
      lanes, lines, boxes, dots,
      pip: thinking ? { x: 350, y: 200 } : { x: 500, y: 350 },
      shA: thinking ? '0 6px 14px -8px rgba(60, 38, 14, 0.5)' : '0 0 0 2px #2F86C6, 0 0 22px -4px rgba(47, 134, 198, 0.55), 0 6px 14px -8px rgba(60, 38, 14, 0.5)',
      shT: thinking ? '0 0 0 2px #B92E3B, 0 0 22px -4px rgba(185, 46, 59, 0.5), 0 6px 14px -8px rgba(60, 38, 14, 0.5)' : '0 6px 14px -8px rgba(60, 38, 14, 0.5)',
      boardLabel: thinking
        ? 'Board, 5 by 5. Ama owns 5 boxes, Tactician owns 4. Tactician is choosing a line.'
        : 'Board, 5 by 5. Ama owns 5 boxes, Tactician owns 4. Ama closed a box and moves again.',
      pill: thinking
        ? { bg: '#F7E3E5', bd: '#B92E3B', tf: 'translateX(100%)', text: 'Tactician is thinking…' }
        : { bg: '#E3EFF8', bd: '#2F86C6', tf: 'none', text: 'Your turn · +1 extra turn' }
    };
  }
}
</script>
</body>
</html>
