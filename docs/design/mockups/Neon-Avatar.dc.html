    const MOUTH = {
      Smile: { f: '', w: '', s: 'M27.8 36.6 Q 32 40.2, 36.2 36.6' },
      Grin: { f: '', w: 'M27.4 36 Q 32 42.2, 36.6 36 Z', s: 'M27.4 36 Q 32 42.2, 36.6 36 Z' },
      Open: { f: EL(32, 37.8, 1.9, 2.3), w: '', s: '' },
      Calm: { f: '', w: '', s: 'M29.2 37.4 H34.8' }
    };
    const GLASSES = {
      None: { f: '', s: '' },
      Round: { f: '', s: C(27.3, 31.2, 3.9) + C(36.7, 31.2, 3.9) + 'M31.2 30.4 Q 32 29.6, 32.8 30.4 M23.4 30.6 L19.8 29.8 M40.6 30.6 L44.2 29.8' },
      Square: { f: '', s: 'M23.3 28.3 H31.3 V34.1 H23.3 Z M32.7 28.3 H40.7 V34.1 H32.7 Z M31.3 30.4 H32.7 M23.3 30.4 L19.8 29.8 M40.7 30.4 L44.2 29.8' },
      Shades: { f: 'M22.6 28.6 H31.4 V32.2 Q 31.4 35.4, 27 35.4 Q 22.6 35.4, 22.6 32.2 Z M32.6 28.6 H41.4 V32.2 Q 41.4 35.4, 37 35.4 Q 32.6 35.4, 32.6 32.2 Z', s: 'M31.4 29.6 H32.6 M22.6 29.4 L19.8 28.8 M41.4 29.4 L44.2 28.8' }
    };
    const HEAD = {
      None: (c) => ({ hw: '', hwc: c, hwd: '', hwdc: c, hwk: '', hws: '' }),
      Cap: (c) => ({ hw: 'M18.4 27.5 C 18.4 17.6, 24.6 12.8, 32 12.8 S 45.6 17.6, 45.6 27.5 Z', hwc: c, hwd: 'M17 27.4 Q 32 23.4, 47 27.4 L 47.6 29.6 Q 32 25.8, 16.4 29.6 Z ' + C(32, 12.9, 1.5), hwdc: shade(c, 0.72), hwk: '', hws: 'M32 13.2 V25.2 M25.2 15.4 Q 23.8 20, 23.6 25.8 M38.8 15.4 Q 40.2 20, 40.4 25.8' }),
      Headphones: (c) => ({ hw: 'M14.2 28.8 Q 14.2 26.8, 16.2 26.8 H19.9 V36.8 H16.2 Q 14.2 36.8, 14.2 34.8 Z M49.8 28.8 Q 49.8 26.8, 47.8 26.8 H44.1 V36.8 H47.8 Q 49.8 36.8, 49.8 34.8 Z', hwc: c, hwd: '', hwdc: c, hwk: 'M17.6 30 C 17.6 9, 46.4 9, 46.4 30', hws: '' }),
      Wrap: (c) => ({ hw: 'M18.2 30.8 C 16.6 17.4, 24.6 11.6, 32 11.6 S 47.4 17.4, 45.8 30.8 C 43.6 25.4, 39.6 22.2, 32 22.2 S 20.4 25.4, 18.2 30.8 Z M26.8 12.8 C 24.4 6.4, 30.2 4.6, 32 9.4 C 33.8 4.6, 39.6 6.4, 37.2 12.8 Z', hwc: c, hwd: C(32, 11.4, 2.1), hwdc: shade(c, 0.72), hwk: '', hws: 'M21 25.2 C 26 19.2, 38 19.2, 43 25.2 M23.8 18.4 C 28 15.6, 36 15.6, 40.2 18.4' })
    };
    const parts = (c) => {
      const sk = SKIN[c.skin];
      const hc = HAIRC[c.hairColour][1];
      const tc = TOPC[c.topColour][1];
      const hs = HAIR[c.hair];
      const tp = TOP[c.top](tc);
      const e = EYES[c.eyes];
      const m = MOUTH[c.mouth];
      const g = GLASSES[c.glasses];
      const w = HEAD[c.headwear](tc);
      const covered = c.headwear === 'Cap' || c.headwear === 'Wrap';
      return {
        bg: BG[c.bg][1], hb: covered ? hs.b : hs.b + hs.t, hc: hc, tc: tc, tk: tp.tk, tsc: tp.tsc, sn: sk[1], td: tp.td, ts: tp.ts,
        sk: sk[0], hf: hs.f, hfc: hs.fuzz ? mix(hc, sk[0], 0.35) : hc, hl: hs.l, ew: e.w, ef: e.f, es: e.s, mf: m.f, mw: m.w, ms: m.s,
        gf: g.f, gs: g.s, hw: w.hw, hwc: w.hwc, hwd: w.hwd, hwdc: w.hwdc, hwk: w.hwk, hws: w.hws
      };
    };

    const OPTS = {
      eyes: ['Dots', 'Happy', 'Wink', 'Wide'], mouth: ['Smile', 'Grin', 'Open', 'Calm'],
      hair: ['Bun', 'Puffs', 'Afro', 'Short', 'Buzz', 'Braids', 'Locs', 'Long'], top: ['Tee', 'Hoodie', 'Collar', 'Jersey'],
      glasses: ['None', 'Round', 'Square', 'Shades'], headwear: ['None', 'Cap', 'Headphones', 'Wrap']
    };
    const COLS = { skin: SKIN.map((s, i) => ['Skin tone ' + (i + 1), s[0]]), hairColour: HAIRC, topColour: TOPC, bg: BG };
    const FULL = '0 0 64 64';
    const FACE = '15 16 34 34';
    const SEC = {
      Face: [{ label: 'Skin tone', key: 'skin', kind: 'sw', cols: 6 }, { label: 'Eyes', key: 'eyes', kind: 'av', vb: FACE }, { label: 'Mouth', key: 'mouth', kind: 'av', vb: FACE }],
      Hair: [{ label: 'Hairstyle', key: 'hair', kind: 'av', vb: FULL }, { label: 'Hair colour', key: 'hairColour', kind: 'sw', cols: 4 }],
      Top: [{ label: 'Top', key: 'top', kind: 'av', vb: '10 22 44 44' }, { label: 'Top colour', key: 'topColour', kind: 'sw', cols: 4 }],
      Extras: [{ label: 'Glasses', key: 'glasses', kind: 'av', vb: '13 15 38 38' }, { label: 'Headwear', key: 'headwear', kind: 'av', vb: FULL }],
      Backdrop: [{ label: 'Background', key: 'bg', kind: 'sw', cols: 5 }]
    };
    const TABS = [
      ['Face', 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18 M9 10h.01 M15 10h.01 M8.5 14.5a4.5 4.5 0 0 0 7 0'],
      ['Hair', 'M5 20v-7a7 7 0 0 1 14 0v7 M5 13c3.5 0 6.5-2 7-5.5c.5 3.5 3.5 5.5 7 5.5'],
      ['Top', 'M8.5 3.5 3 6.5l2 4.5 2.5-1V20.5h9V10l2.5 1 2-4.5-5.5-3c-.6 1.6-1.9 2.5-3.5 2.5s-2.9-.9-3.5-2.5z'],
      ['Extras', 'M2.5 14a3.5 3.5 0 1 0 7 0a3.5 3.5 0 1 0-7 0 M14.5 14a3.5 3.5 0 1 0 7 0a3.5 3.5 0 1 0-7 0 M9.5 13.6c1.6-1 3.4-1 5 0 M2.8 12.6 5 7h2.5 M21.2 12.6 19 7h-2.5'],
      ['Backdrop', 'M4 4h16v16H4z M4 16l4.5-4.5 4 4 2.5-2.5 5 5 M15.5 8.5h.01']
    ];
    const GLASS_WORDS = { Round: 'round glasses', Square: 'square glasses', Shades: 'sunglasses' };

    const AMA = { skin: 4, hair: 'Bun', hairColour: 0, eyes: 'Dots', mouth: 'Smile', top: 'Tee', topColour: 0, glasses: 'None', headwear: 'None', bg: 0 };
    const st = this.state || {};
    const cur = st.cur || AMA;
    const saved = st.saved || AMA;
    const tab = st.tab || this.props.tab || 'Hair';
    const set = (k, v) => () => { const nx = Object.assign({}, cur); nx[k] = v; this.setState({ cur: nx, justSaved: false }); };
    const any = (list) => list[Math.floor(Math.random() * list.length)];
    const shuffle = () => this.setState({
      justSaved: false,
      cur: {
        skin: Math.floor(Math.random() * SKIN.length), hair: any(OPTS.hair), hairColour: Math.floor(Math.random() * HAIRC.length),
        eyes: any(OPTS.eyes), mouth: any(OPTS.mouth), top: any(OPTS.top), topColour: Math.floor(Math.random() * TOPC.length),
        glasses: Math.random() < 0.6 ? 'None' : any(OPTS.glasses), headwear: Math.random() < 0.6 ? 'None' : any(OPTS.headwear),
        bg: Math.floor(Math.random() * BG.length)
      }
    });
    const undo = () => this.setState({ cur: saved, justSaved: false });
    const save = () => this.setState({ saved: cur, justSaved: true });
    const tabs = TABS.map((t) => {
      const on = t[0] === tab;
      return { label: t[0], icon: t[1], on: on, pick: () => this.setState({ tab: t[0] }), bg: on ? T.tabOnBg : T.tabBg, fg: on ? T.tabOnFg : T.tabFg, sh: on ? T.tabOnSh : T.tabSh };
    });
    const sections = SEC[tab].map((sec) => {
      const items = sec.kind === 'av'
        ? OPTS[sec.key].map((v) => {
            const cfg = Object.assign({}, cur);
            cfg[sec.key] = v;
            const on = cur[sec.key] === v;
            return Object.assign(parts(cfg), { label: v, on: on, pick: set(sec.key, v), vb: sec.vb, cbg: on ? T.cellOn : T.cell, ring: on ? T.cellOnRing : T.cellRing, loop: on ? 1 : 0 });
          })
        : COLS[sec.key].map((pair, i) => {
            const on = cur[sec.key] === i;
            return { label: pair[0], color: pair[1], on: on, pick: set(sec.key, i), ring: on ? T.swOnRing : T.swRing, loop: on ? 1 : 0 };
          });
      return { label: sec.label, isAv: sec.kind === 'av', isSw: sec.kind === 'sw', cols: sec.cols || 4, items: items };
    });
    const pvLabel = 'Your avatar: ' + cur.hair.toLowerCase() + ' hair in ' + HAIRC[cur.hairColour][0].toLowerCase() + ', ' +
      TOPC[cur.topColour][0].toLowerCase() + ' ' + cur.top.toLowerCase() +
      (cur.glasses === 'None' ? '' : ', ' + GLASS_WORDS[cur.glasses]) +
      (cur.headwear === 'None' ? '' : ', ' + cur.headwear.toLowerCase()) + ', on ' + BG[cur.bg][0].toLowerCase();
    return { pv: parts(cur), sv: parts(saved), pvLabel: pvLabel, tabs: tabs, tabLabel: tab, sections: sections, undo: undo, shuffle: shuffle, save: save, saveLabel: st.justSaved ? 'Saved' : 'Save avatar' };
  }
}
</script>
