="44" width="8" height="7" fill="#241C15"></rect><path d="M32 18 V12" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"></path><circle cx="32" cy="9.5" r="3.8" fill="#7FD3DD" stroke="#FFFFFF" stroke-width="2"></circle><rect x="11.5" y="25.5" width="6" height="13" rx="3" fill="#FFFFFF"></rect><rect x="46.5" y="25.5" width="6" height="13" rx="3" fill="#FFFFFF"></rect><rect x="16" y="17" width="32" height="28" rx="9" fill="#FFFFFF"></rect><rect x="20" y="24" width="24" height="12" rx="6" fill="#241C15"></rect><circle cx="26.5" cy="30" r="2.7" fill="#7FD3DD"></circle><circle cx="37.5" cy="30" r="2.7" fill="#7FD3DD"></circle><rect x="26.5" y="39" width="11" height="2.8" rx="1.4" fill="#241C15"></rect></svg></span></span></div>
<div style="position: relative; flex: 1; display: flex; align-items: center; justify-content: center">
<div style="width: 358px; box-sizing: border-box; padding: 5px; background: #1C1D20">
<svg viewBox="0 0 600 600" style="display: block; width: 100%; height: auto">
<sc-for list="{{boxes}}" as="b" hint-placeholder-count="25">
<rect x="{{b.x}}" y="{{b.y}}" width="86" height="86" fill="{{b.fill}}" stroke="{{b.rim}}" stroke-width="8" stroke-opacity="0.6"></rect>
<path d="{{b.icon}}" fill="#FFFFFF" fill-rule="evenodd" opacity="0.94"></path>
</sc-for>
<sc-for list="{{lines}}" as="l" hint-placeholder-count="60">
<line x1="{{l.x1}}" y1="{{l.y1}}" x2="{{l.x2}}" y2="{{l.y2}}" stroke="#DADADF" stroke-width="15"></line>
</sc-for>
<sc-for list="{{dots}}" as="d" hint-placeholder-count="36">
<circle cx="{{d.x}}" cy="{{d.y}}" r="14" fill="#A9A9B0"></circle>
</sc-for>
</svg>
</div>
</div>
<div style="height: 112px"></div>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0, 0, 0, 0.6)"></div>
<section role="dialog" aria-modal="true" aria-labelledby="resTitle" style="position: absolute; left: 16px; right: 16px; top: 50%; transform: translateY(-50%); box-sizing: border-box; padding: 24px 20px 20px; background: #1C1D20; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.05), 0 30px 60px -20px rgba(0, 0, 0, 0.9); text-align: center; color: #F2EBE3; opacity: 0.9">
<svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true" style="display: block; margin: 0 auto 8px"><path d="M20 10h24v12a12 12 0 0 1-24 0Z" fill="#FFD166"></path><path d="M20 14h-8v4a8 8 0 0 0 8 8M44 14h8v4a8 8 0 0 1-8 8" fill="none" stroke="#FFD166" stroke-width="4"></path><rect x="28" y="34" width="8" height="10" fill="#FFD166"></rect><rect x="20" y="46" width="24" height="7" rx="3" fill="#FFD166"></rect></svg>
<h2 id="resTitle" style="margin: 0; font-weight: 800; font-size: 36px; line-height: 1.1">You win!</h2>
<div aria-label="Score 14 to 11" style="margin: 8px 0 2px; font-weight: 800; font-size: 40px; line-height: 1.1; font-variant-numeric: tabular-nums"><span style="color: #8CC4EE">14</span><span style="color: #B9AA98; margin: 0 0.2em">–</span><span style="color: #F29AA3">11</span></div>
<div style="display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin: 10px 0 14px; font-variant-numeric: tabular-nums">
<span style="display: inline-flex; align-items: center; gap: 5px; min-height: 30px; padding: 2px 12px; border-radius: 999px; background: #2E2823; font-weight: 600; font-size: 13px">Time <b style="font-weight: 700">4:12.3</b></span><span style="display: inline-flex; align-items: center; gap: 5px; min-height: 30px; padding: 2px 12px; border-radius: 999px; background: #2E2823; font-weight: 600; font-size: 13px">5×5</span><span style="display: inline-flex; align-items: center; gap: 5px; min-height: 30px; padding: 2px 12px; border-radius: 999px; background: #2E2823; font-weight: 600; font-size: 13px">Medium</span>
</div>
<div style="text-align: left; padding: 14px; border-radius: 14px; background: #2E2823">
<div style="display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; font-size: 15px"><span>Level 7</span><span style="font-weight: 800; font-size: 16px; color: #3FB8C5">+168 XP</span></div>
<div role="progressbar" aria-label="Progress to level 8" aria-valuenow="208" aria-valuemin="0" aria-valuemax="400" style="height: 10px; border-radius: 999px; background: #3A332D; overflow: hidden; margin-top: 8px"><b style="display: block; width: 52%; height: 100%; border-radius: inherit; background: #3FB8C5"></b></div>
<div style="margin-top: 6px; font-size: 13px; color: #B9AA98; font-variant-numeric: tabular-nums">208 / 400 XP to level 8</div>
</div>
<p style="margin: 12px 0 0; font-weight: 600; font-size: 14.5px; line-height: 1.5">You were 1:05.5 slower than the #1 time on 5×5 Medium (Kwame, 3:06.8).</p>
<p style="margin: 6px 0 0; font-weight: 600; font-size: 14px; color: #B9AA98">Fastest-win rank: #12 → #8</p>
<div style="display: grid; gap: 10px; margin-top: 16px">
<button style="min-height: 56px; border: 0; border-radius: 999px; background: #0E8E9C; color: #FFFFFF; box-shadow: inset 0 0 0 3px #3FB8C5, 0 5px 0 #0A6670; font-weight: 700; font-size: 20px">Play again</button>
<div style="display: flex; gap: 10px">
<button style="flex: 1; min-height: 46px; padding: 8px 10px; border: 0; border-radius: 999px; background: #2E2823; color: #F2EBE3; box-shadow: 0 3px 0 #15110E; font-weight: 600; font-size: 15px; white-space: nowrap">Change settings</button>
<button style="flex: 1; min-height: 46px; padding: 8px 10px; border: 0; border-radius: 999px; background: #2E2823; color: #F2EBE3; box-shadow: 0 3px 0 #15110E; font-weight: 600; font-size: 15px; white-space: nowrap">Leaderboard</button>
</div>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const F = ['ttaaa', 'taaaa', 'tatta', 'tatta', 'tataa'];
    const P = (i) => 50 + i * 100;
    const fill = { a: '#2F86C6', t: '#D0414E' };
    const rim = { a: '#1F5F8C', t: '#9A2B37' };
    const circ = (x, y, r) => 'M' + (x - r) + ' ' + y + ' a' + r + ' ' + r + ' 0 1 0 ' + (2 * r) + ' 0 a' + r + ' ' + r + ' 0 1 0 ' + (-2 * r) + ' 0 Z ';
    const rr = (x, y, w, h, r) => 'M' + (x + r) + ' ' + y + ' H' + (x + w - r) + ' Q' + (x + w) + ' ' + y + ' ' + (x + w) + ' ' + (y + r) + ' V' + (y + h - r) + ' Q' + (x + w) + ' ' + (y + h) + ' ' + (x + w - r) + ' ' + (y + h) + ' H' + (x + r) + ' Q' + x + ' ' + (y + h) + ' ' + x + ' ' + (y + h - r) + ' V' + (y + r) + ' Q' + x + ' ' + y + ' ' + (x + r) + ' ' + y + ' Z ';
    const person = (x, y) => circ(x, y - 11, 9) + 'M' + (x - 17) + ' ' + (y + 19) + ' C' + (x - 17) + ' ' + (y + 2) + ' ' + (x + 17) + ' ' + (y + 2) + ' ' + (x + 17) + ' ' + (y + 19) + ' Z';
    const bot = (x, y) => rr(x - 17, y - 8, 34, 26, 7) + circ(x - 7, y + 4, 3.6) + circ(x + 7, y + 4, 3.6) + circ(x, y - 16, 3.4) + 'M' + (x - 1.6) + ' ' + (y - 12.6) + ' H' + (x + 1.6) + ' V' + (y - 8) + ' H' + (x - 1.6) + ' Z';
    const lines = [];
    const boxes = [];
    const dots = [];
    for (let r = 0; r < 6; r++) for (let c = 0; c < 5; c++) lines.push({ x1: P(c), y1: P(r), x2: P(c + 1), y2: P(r) });
    for (let r = 0; r < 5; r++) for (let c = 0; c < 6; c++) lines.push({ x1: P(c), y1: P(r), x2: P(c), y2: P(r + 1) });
    F.forEach((row, r) => row.split('').forEach((ch, c) => {
      const cx = P(c) + 50, cy = P(r) + 50;
      boxes.push({ x: P(c) + 7, y: P(r) + 7, fill: fill[ch], rim: rim[ch], icon: ch === 'a' ? person(cx, cy) : bot(cx, cy) });
    }));
    for (let r = 0; r < 6; r++) for (let c = 0; c < 6; c++) dots.push({ x: P(c), y: P(r) });
    return { lines, boxes, dots };
  }
}
</script>
