<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const F = ['ttaaa', 'taaaa', 'tatta', 'tatta', 'tataa'];
    const P = (i) => 50 + i * 100;
    const fill = { a: '#FB5553', t: '#736C7E' };
    const ink = { a: '#FFFFFF', t: '#FFFFFF' };
    const lines = [];
    const boxes = [];
    const dots = [];
    for (let r = 0; r < 6; r++) for (let c = 0; c < 5; c++) lines.push({ x1: P(c), y1: P(r), x2: P(c + 1), y2: P(r) });
    for (let r = 0; r < 5; r++) for (let c = 0; c < 6; c++) lines.push({ x1: P(c), y1: P(r), x2: P(c), y2: P(r + 1) });
    F.forEach((row, r) => row.split('').forEach((ch, c) => {
      boxes.push({ x: P(c) + 10, y: P(r) + 10, cx: P(c) + 50, cy: P(r) + 51, fill: fill[ch], ink: ink[ch], pat: ch === 'a' ? 'url(#pa)' : 'url(#pt)', ini: ch === 'a' ? 'A' : 'T' });
    }));
    for (let r = 0; r < 6; r++) for (let c = 0; c < 6; c++) dots.push({ x: P(c), y: P(r) });
    return { lines, boxes, dots };
  }
}
</script>
